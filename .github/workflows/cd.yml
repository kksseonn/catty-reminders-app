name: CD

on:
  release:
    types: [ published ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

      - name: Deploy Docker container to VM
        run: |
          echo "Starting Docker deployment..."
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -i ~/.ssh/vm_key \
              -p 2451 \
              user@course.prafdin.ru "
            
            echo 'Logging in to GHCR...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo 'Pulling latest Docker image...'
            docker pull ghcr.io/kksseonn/catty-reminders:latest
            
            echo 'Stopping old container if exists...'
            docker stop catty || true
            docker rm catty || true
            
            echo 'Starting new container...'
            docker run -d \
              --name catty \
              --restart unless-stopped \
              -p 8181:8181 \
              ghcr.io/kksseonn/catty-reminders:latest
            
            echo 'Cleaning up old images...'
            docker image prune -f
            
            echo 'Docker deployment completed!'
            echo 'Container status:'
            docker ps --filter 'name=catty'
            echo 'Application available at: http://app.spiridonova.course.prafdin.ru'
          "