name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

      - name: Deploy with Docker Compose to VM
        run: |
          echo "Starting Docker Compose deployment..."
          ssh -o StrictHostKeyChecking=no \
              -o ConnectTimeout=15 \
              -i ~/.ssh/vm_key \
              -p 2451 \
              user@course.prafdin.ru "
            echo 'Creating necessary directories...'          
            
            cd ~/Desktop/lab1/catty-reminders-app || exit 1
            echo 'Logging in to GHCR...'
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo 'Pulling latest images...'
            docker compose -f docker-compose.yml pull
            
            echo 'Stopping and removing old containers...'
            docker compose -f docker-compose.yml down
            
            echo 'Starting new containers with Docker Compose...'
            docker compose -f docker-compose.yml up -d

            echo 'Docker Compose deployment completed!'
            echo 'Containers status:'
            docker compose -f ~/Desktop/lab1/catty-reminders-app/docker-compose.yml ps
            echo 'Application: http://app.spiridonova.course.prafdin.ru'
          "
