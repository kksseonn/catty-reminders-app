name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key

      - name: Copy docker-compose.yaml to VM
        run: |
          scp -i ~/.ssh/vm_key -P 2451 /home/user/Desktop/lab1/catty-reminders-app/docker-compose.yaml user@course.prafdin.ru:~/app/

      - name: Deploy with Docker Compose
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/vm_key -p 2451 user@course.prafdin.ru "
                mkdir -p ~/app
                cd ~/app

                docker compose version || echo 'Docker Compose не установлен'

                echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin

                docker compose pull

                docker compose up -d

                docker compose ps
              "